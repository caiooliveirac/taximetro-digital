name: Deploy

# Produção: host Magalu (201.23.89.0) — migrado da EC2 AWS em 2026-07.
# Padrão do host (igual checklist/plantoes): container em --network host,
# Postgres 16 nativo em 127.0.0.1:5432, Nginx roteia mnrs.com.br/taximetro
# para 127.0.0.1:3000 (bloco em /etc/nginx/sites-enabled/estaticos.conf).

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      apply_db_changes:
        description: "Run schema changes manually (drizzle push --force)"
        required: false
        type: boolean
        default: false

concurrency:
  group: taximetro-digital-deploy
  cancel-in-progress: true

env:
  APP: taximetro-digital
  REMOTE: ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}
  DEPLOY_DIR: /home/ubuntu/taximetro-digital

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build app
        run: npm run build

  db_changes:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_db_changes }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.PROD_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Send source to server
        run: |
          rsync -az --delete \
            --exclude node_modules --exclude .next --exclude .git \
            --exclude '.env*' --include '.env.example' \
            ./ ${{ env.REMOTE }}:${{ env.DEPLOY_DIR }}/

      - name: Apply schema changes (manual only)
        run: |
          ssh -o ServerAliveInterval=20 -o ServerAliveCountMax=180 ${{ env.REMOTE }} bash -s << 'REMOTE_SCRIPT'
            set -euo pipefail
            cd ${{ env.DEPLOY_DIR }}

            echo "=== Building builder image ==="
            docker build --pull --progress=plain --target builder -t ${{ env.APP }}-builder .

            echo "=== Running schema changes (manual trigger) ==="
            docker run --rm \
              --network host \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              ${{ env.APP }}-builder \
              npx drizzle-kit push --force

            echo "=== Recreating available_slots materialized view/triggers ==="
            docker run --rm \
              --network host \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -v "$(pwd)/scripts/materialized-view-available-slots.sql:/tmp/mv.sql:ro" \
              postgres:16-alpine \
              sh -c 'psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f /tmp/mv.sql'

            echo "=== Schema changes complete ==="
          REMOTE_SCRIPT

  deploy:
    needs: [test, db_changes]
    if: ${{ always() && needs.test.result == 'success' && (needs.db_changes.result == 'success' || needs.db_changes.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.PROD_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Send source to server
        run: |
          rsync -az --delete \
            --exclude node_modules --exclude .next --exclude .git \
            --exclude '.env*' --include '.env.example' \
            ./ ${{ env.REMOTE }}:${{ env.DEPLOY_DIR }}/

      - name: Build and deploy on server
        run: |
          ssh -o ServerAliveInterval=20 -o ServerAliveCountMax=180 ${{ env.REMOTE }} bash -s << 'REMOTE_SCRIPT'
            set -euo pipefail
            cd ${{ env.DEPLOY_DIR }}

            IMAGE_CANDIDATE="${{ env.APP }}:candidate"
            CANARY_NAME="${{ env.APP }}-canary"

            echo "=== Building Docker image ==="
            docker build --pull --progress=plain -t "$IMAGE_CANDIDATE" .

            echo "=== Ensuring backup volume exists ==="
            sudo mkdir -p /var/backups/taximetro
            sudo chmod 777 /var/backups/taximetro

            echo "=== Starting canary for pre-swap validation (porta 3011) ==="
            docker rm -f "$CANARY_NAME" 2>/dev/null || true
            docker run --rm \
              -d \
              --name "$CANARY_NAME" \
              --network host \
              -e PORT=3011 \
              -e HOSTNAME=127.0.0.1 \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e AUTH_SECRET="${{ secrets.AUTH_SECRET }}" \
              -e AUTH_URL="https://mnrs.com.br" \
              -e GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
              -e GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              -e TELEGRAM_BOT_TOKEN_NEXT="${{ secrets.TELEGRAM_BOT_TOKEN_NEXT }}" \
              -e TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
              -e TELEGRAM_GROUP_ID="${{ secrets.TELEGRAM_GROUP_ID }}" \
              -e SMTP_HOST="${{ secrets.SMTP_HOST }}" \
              -e SMTP_PORT="${{ secrets.SMTP_PORT }}" \
              -e SMTP_USER="${{ secrets.SMTP_USER }}" \
              -e SMTP_PASS="${{ secrets.SMTP_PASS }}" \
              -e SMTP_FROM="${{ secrets.SMTP_FROM }}" \
              -e DB_BACKUP_EMAIL_TO="${{ secrets.DB_BACKUP_EMAIL_TO }}" \
              -e DB_BACKUP_ENABLED=false \
              "$IMAGE_CANDIDATE"

            echo "=== Validating canary health ==="
            for i in $(seq 1 45); do
              if curl -fsS http://127.0.0.1:3011/taximetro/api/health 2>/dev/null | grep -q healthy; then
                echo "✅ Canary healthy after ${i}s"
                break
              fi
              if [ "$i" -eq 45 ]; then
                echo "❌ Canary health check failed after 45s"
                docker logs --tail 40 "$CANARY_NAME" || true
                docker rm -f "$CANARY_NAME" 2>/dev/null || true
                exit 1
              fi
              sleep 1
            done

            echo "=== Replacing production container only after validation ==="
            docker rm -f ${{ env.APP }} 2>/dev/null || true

            echo "=== Starting container (porta 3000, network host) ==="
            docker run -d \
              --name ${{ env.APP }} \
              --restart unless-stopped \
              --network host \
              -e HOSTNAME=127.0.0.1 \
              -v /var/backups/taximetro:/var/backups/taximetro \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e AUTH_SECRET="${{ secrets.AUTH_SECRET }}" \
              -e AUTH_URL="https://mnrs.com.br" \
              -e GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
              -e GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              -e TELEGRAM_BOT_TOKEN_NEXT="${{ secrets.TELEGRAM_BOT_TOKEN_NEXT }}" \
              -e TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
              -e TELEGRAM_GROUP_ID="${{ secrets.TELEGRAM_GROUP_ID }}" \
              -e SMTP_HOST="${{ secrets.SMTP_HOST }}" \
              -e SMTP_PORT="${{ secrets.SMTP_PORT }}" \
              -e SMTP_USER="${{ secrets.SMTP_USER }}" \
              -e SMTP_PASS="${{ secrets.SMTP_PASS }}" \
              -e SMTP_FROM="${{ secrets.SMTP_FROM }}" \
              -e DB_BACKUP_EMAIL_TO="${{ secrets.DB_BACKUP_EMAIL_TO }}" \
              "$IMAGE_CANDIDATE"

            echo "=== Waiting for production healthcheck ==="
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:3000/taximetro/api/health 2>/dev/null | grep -q healthy; then
                echo "✅ App healthy after ${i}s"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "❌ Health check failed after 30s"
                docker logs --tail 20 ${{ env.APP }}
                exit 1
              fi
              sleep 1
            done

            echo "=== Reloading nginx ==="
            sudo systemctl reload nginx
            sudo systemctl is-active nginx

            echo "=== Smoke test via nginx ==="
            HTTP_CODE=$(curl -sk -o /dev/null -w "%{http_code}" "https://127.0.0.1/taximetro/login" -H "Host: mnrs.com.br")
            if [ "$HTTP_CODE" != "200" ]; then
              echo "❌ External smoke failed: HTTP $HTTP_CODE"
              exit 1
            fi
            echo "✅ External smoke OK (HTTP 200)"

            echo "=== Cleaning temporary canary ==="
            docker rm -f "$CANARY_NAME" 2>/dev/null || true

            echo "=== Deploy complete ==="
          REMOTE_SCRIPT
